plugins {
    id 'com.android.application' version '8.13.2'
}

def repositoryRoot = rootDir.parentFile
layout.buildDirectory.set(new File(repositoryRoot, 'build/play-gradle'))
def contentRoot = layout.buildDirectory.dir('generated/fudool/assets')
def generatedResources = layout.buildDirectory.dir('generated/fudool/res')
def credential = { name -> providers.environmentVariable(name).orNull }

android {
    namespace 'com.kokabfodool.shell'
    compileSdk 36
    defaultConfig {
        applicationId 'com.kokabfodool.offline'
        minSdk 23
        targetSdk 36
        versionCode 79
        versionName '6.9.0'
    }
    signingConfigs {
        release {
            if (credential('FUDOOL_KEYSTORE')) {
                storeFile file(credential('FUDOOL_KEYSTORE'))
                storePassword credential('FUDOOL_STORE_PASSWORD')
                keyAlias credential('FUDOOL_KEY_ALIAS')
                keyPassword credential('FUDOOL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main {
        manifest.srcFile 'play/AndroidManifest.xml'
        java.setSrcDirs(['.'])
        java.include '*.java'
        java.exclude '.gradle/**', 'build/**', 'play/**'
        res.setSrcDirs(['play/res', generatedResources])
        assets.setSrcDirs([contentRoot])
    }
}

tasks.register('stageFudoolAssets', Exec) {
    workingDir repositoryRoot
    inputs.file new File(repositoryRoot, 'offline-pack.json')
    doNotTrackState('Stage the current files listed in the offline pack each build')
    commandLine 'python3', 'scripts/stage-play-assets.py',
        contentRoot.get().asFile.absolutePath, generatedResources.get().asFile.absolutePath
}
tasks.named('preBuild').configure { dependsOn 'stageFudoolAssets' }
